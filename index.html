<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Caixa</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base para parecer um app nativo */
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: white; box-shadow: 0 0 15px rgba(0,0,0,0.05); position: relative; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ================= TELA DE LOGIN ================= -->
    <div id="loginScreen" class="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-900 text-white">
        <div class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-xl">
            <h1 class="text-2xl font-bold text-center mb-6">🔒 Acesso Restrito</h1>
            <input type="password" id="senha" placeholder="Digite sua senha" 
                   class="w-full p-3 rounded-lg bg-slate-700 text-white border-none focus:ring-2 focus:ring-blue-500 mb-4 outline-none">
            <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">
                Entrar
            </button>
        </div>
    </div>

    <!-- ================= TELA PRINCIPAL (DASHBOARD) ================= -->
    <div id="mainScreen" class="hidden min-h-screen flex flex-col bg-slate-50">
        <div class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold">Meu Caixa</h1>
                <button onclick="sair()" class="text-sm bg-blue-700 px-3 py-1 rounded-full">Sair</button>
            </div>
            
            <p class="text-blue-200 text-sm">Balanço de Outubro</p>
            <h2 class="text-3xl font-bold mt-1" id="saldoTotal">R$ 1.250,00</h2>
            
            <div class="flex gap-4 mt-6">
                <div class="flex-1 bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                    <p class="text-xs text-blue-100 mb-1">Recebido (Crédito)</p>
                    <p class="text-lg font-bold text-green-300" id="valorRecebido">R$ 3.500,00</p>
                </div>
                <div class="flex-1 bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                    <p class="text-xs text-blue-100 mb-1">Gasto (Débito)</p>
                    <p class="text-lg font-bold text-red-300" id="valorGasto">R$ 2.250,00</p>
                </div>
            </div>
        </div>

        <div class="p-6 flex flex-col gap-4 mt-4">
            <button onclick="navegarPara('formScreen')" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition">
                <span>➕</span> Novo Lançamento
            </button>
            
            <button onclick="navegarPara('historyScreen')" class="w-full bg-white text-slate-800 border-2 border-slate-200 font-bold py-4 rounded-xl shadow-sm flex items-center justify-center gap-2 active:scale-95 transition">
                <span>📊</span> Consultar Registros
            </button>
        </div>
    </div>

    <!-- ================= TELA DE INSERÇÃO ================= -->
    <div id="formScreen" class="hidden min-h-screen flex flex-col bg-white">
        <div class="bg-slate-900 text-white p-4 flex items-center gap-4 sticky top-0 z-10">
            <button onclick="navegarPara('mainScreen')" class="p-2">⬅️</button>
            <h2 class="text-lg font-bold">Novo Lançamento</h2>
        </div>

        <form id="lancamentoForm" class="p-6 flex flex-col gap-4" onsubmit="salvarLancamento(event)">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Tipo</label>
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="tipo" value="Credito" class="peer hidden" checked>
                        <div class="text-center py-3 border-2 rounded-lg peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 font-semibold text-slate-500 transition">Receita (Crédito)</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="tipo" value="Debito" class="peer hidden">
                        <div class="text-center py-3 border-2 rounded-lg peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 font-semibold text-slate-500 transition">Despesa (Débito)</div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="valor" required placeholder="0.00" class="w-full p-3 border-2 border-slate-200 rounded-lg text-lg focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Descrição</label>
                <input type="text" id="descricao" required placeholder="Ex: Almoço cliente, Venda de serviço..." class="w-full p-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Data</label>
                <input type="date" id="data" required class="w-full p-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none">
            </div>

            <!-- Botões de Câmera -->
            <div class="flex gap-4 mt-2">
                <div class="flex-1 relative">
                    <input type="file" id="fotoItem" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-24">
                        <span class="text-2xl mb-1">📷</span>
                        <span class="text-xs font-bold text-center" id="lblFotoItem">Foto do Item</span>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <input type="file" id="fotoNota" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-24">
                        <span class="text-2xl mb-1">🧾</span>
                        <span class="text-xs font-bold text-center" id="lblFotoNota">Foto da Nota</span>
                    </div>
                </div>
            </div>

            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-4 active:scale-95 transition flex justify-center items-center">
                Salvar Lançamento
            </button>
            <p id="statusMsg" class="text-center text-sm font-bold hidden"></p>
        </form>
    </div>

    <!-- ================= TELA DE CONSULTA ================= -->
    <div id="historyScreen" class="hidden min-h-screen flex flex-col bg-slate-50">
        <div class="bg-slate-900 text-white p-4 flex items-center gap-4 sticky top-0 z-10 shadow-md">
            <button onclick="navegarPara('mainScreen')" class="p-2">⬅️</button>
            <h2 class="text-lg font-bold">Registros</h2>
        </div>

        <div class="p-4 flex flex-col gap-3" id="listaRegistros">
            <!-- Item Mockado para visualização -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                <div class="flex gap-3 items-center">
                    <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600">📉</div>
                    <div>
                        <h3 class="font-bold text-slate-800">Almoço Restaurante</h3>
                        <p class="text-xs text-slate-500">17/10/2026</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-bold text-red-600">- R$ 45,90</p>
                    <div class="flex gap-2 mt-1 justify-end">
                        <span class="text-xs bg-slate-100 px-2 py-1 rounded cursor-pointer" title="Ver Item">📷</span>
                        <span class="text-xs bg-slate-100 px-2 py-1 rounded cursor-pointer" title="Ver Nota">🧾</span>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                <div class="flex gap-3 items-center">
                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600">📈</div>
                    <div>
                        <h3 class="font-bold text-slate-800">Venda do Monitor</h3>
                        <p class="text-xs text-slate-500">15/10/2026</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-bold text-green-600">+ R$ 600,00</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // === 1. LÓGICA DE NAVEGAÇÃO E LOGIN ===
    const SENHA_SECRETA = "leo123"; // Troque pela senha que desejar

    function fazerLogin() {
        const inputSenha = document.getElementById('senha').value;
        if (inputSenha === SENHA_SECRETA) {
            navegarPara('mainScreen');
            document.getElementById('senha').value = '';
            // Preenche a data de hoje no formulário automaticamente
            document.getElementById('data').valueAsDate = new Date();
        } else {
            alert("Senha incorreta!");
        }
    }

    function sair() {
        navegarPara('loginScreen');
    }

    function navegarPara(telaId) {
        ['loginScreen', 'mainScreen', 'formScreen', 'historyScreen'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(telaId).classList.remove('hidden');
    }

    // === 2. LÓGICA DE INTERFACE DE ARQUIVOS (UX) ===
    // Muda o texto do botão quando uma foto é tirada
    document.getElementById('fotoItem').addEventListener('change', function() {
        if(this.files.length > 0) document.getElementById('lblFotoItem').innerText = "Item OK ✅";
    });
    document.getElementById('fotoNota').addEventListener('change', function() {
        if(this.files.length > 0) document.getElementById('lblFotoNota').innerText = "Nota OK ✅";
    });

    // === 3. CONVERSÃO DE IMAGEM PARA BASE64 (PREPARAÇÃO PARA O BACKEND) ===
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                mimeType: file.type,
                // Remove o prefixo "data:image/jpeg;base64," para enviar puro pro Google
                data: reader.result.split(',')[1] 
            });
            reader.onerror = error => reject(error);
        });
    }

    // === 4. ENVIO DOS DADOS ===
    async function salvarLancamento(event) {
        event.preventDefault(); // Impede a página de recarregar
        
        const btnSalvar = document.getElementById('btnSalvar');
        const statusMsg = document.getElementById('statusMsg');
        
        btnSalvar.innerText = "Processando... ⏳";
        btnSalvar.disabled = true;

        try {
            // 1. Pega os dados do formulário
            const dados = {
                tipo: document.querySelector('input[name="tipo"]:checked').value,
                valor: document.getElementById('valor').value,
                descricao: document.getElementById('descricao').value,
                data: document.getElementById('data').value
            };

            // 2. Converte as fotos para Base64
            const fileItem = document.getElementById('fotoItem').files[0];
            const fileNota = document.getElementById('fotoNota').files[0];
            
            dados.fotoItem = await fileToBase64(fileItem);
            dados.fotoNota = await fileToBase64(fileNota);

            console.log("Dados prontos para envio ao Google Apps Script:", dados);

            // ============================================================
            // AQUI ENTRARÁ O FETCH PARA A URL DO GOOGLE APPS SCRIPT
            // Exemplo (comentado por enquanto):
            // const URL_APPS_SCRIPT = "SUA_URL_AQUI";
            // await fetch(URL_APPS_SCRIPT, {
            //     method: 'POST',
            //     body: JSON.stringify(dados)
            // });
            // ============================================================

            // Simula um tempo de rede para efeito visual
            await new Promise(r => setTimeout(r, 1000));

            // Sucesso!
            statusMsg.innerText = "Lançamento salvo com sucesso! ✅";
            statusMsg.classList.remove('hidden', 'text-red-500');
            statusMsg.classList.add('text-green-600');
            
            // Limpa o formulário
            document.getElementById('lancamentoForm').reset();
            document.getElementById('data').valueAsDate = new Date();
            document.getElementById('lblFotoItem').innerText = "Foto do Item";
            document.getElementById('lblFotoNota').innerText = "Foto da Nota";

            setTimeout(() => { 
                statusMsg.classList.add('hidden'); 
                navegarPara('mainScreen');
            }, 2000);

        } catch (error) {
            console.error("Erro:", error);
            statusMsg.innerText = "Erro ao salvar. Tente novamente. ❌";
            statusMsg.classList.remove('hidden', 'text-green-600');
            statusMsg.classList.add('text-red-500');
        } finally {
            btnSalvar.innerText = "Salvar Lançamento";
            btnSalvar.disabled = false;
        }
    }
</script>
</body>
</html>
