<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meu Caixa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            background-color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container { 
            width: 100%; max-width: 100%; min-height: 100vh; background-color: white; position: relative; overflow-x: hidden;
        }
        @media (min-width: 768px) {
            .app-container {
                max-width: 800px; min-height: auto; margin: 40px auto; border-radius: 1.5rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-slate-800">

<div class="app-container">

    <!-- ================= TELA DE LOGIN ================= -->
    <div id="loginScreen" class="flex flex-col items-center justify-center min-h-screen md:min-h-[600px] p-6 bg-slate-900 text-white">
        <div class="w-full max-w-sm bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <h1 class="text-3xl font-bold text-center mb-2">Meu Caixa</h1>
            <p class="text-slate-400 text-center mb-6 text-sm">Acesso Restrito</p>
            <input type="password" id="senha" placeholder="Digite sua senha" 
                   class="w-full p-4 rounded-xl bg-slate-900 text-white border border-slate-700 focus:border-blue-500 outline-none mb-4">
            <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition">
                Entrar
            </button>
        </div>
    </div>

    <!-- ================= TELA PRINCIPAL (DASHBOARD) ================= -->
    <div id="mainScreen" class="hidden flex-col bg-slate-50 min-h-screen md:min-h-[600px]">
        <div class="bg-blue-600 text-white p-6 md:p-10 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold">Painel Geral</h1>
                    <button onclick="carregarRegistros()" class="text-lg bg-white/20 hover:bg-white/30 p-2 rounded-full active:scale-95 transition" title="Atualizar Dados">🔄</button>
                </div>
                <button onclick="sair()" class="text-sm bg-slate-900/50 px-4 py-2 rounded-full">Sair</button>
            </div>
            
            <div class="bg-blue-800/50 rounded-xl p-3 mb-6 flex justify-between items-center text-sm border border-blue-500/30">
                <span class="font-bold">Neste Mês:</span>
                <span class="text-green-300">📈 + R$ <span id="mesCredito">0,00</span></span>
                <span class="text-red-300">📉 - R$ <span id="mesDebito">0,00</span></span>
            </div>
            
            <p class="text-blue-200 text-sm md:text-base">Saldo Total Acumulado</p>
            <h2 class="text-4xl md:text-5xl font-bold mt-1" id="saldoTotal">R$ 0,00</h2>
        </div>

        <div class="p-6 md:p-10 grid grid-cols-1 gap-4">
            <button onclick="navegarPara('formScreen')" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-lg text-lg flex items-center justify-center gap-2 active:scale-95 transition">
                <span>➕</span> Novo Lançamento
            </button>
            <button onclick="navegarPara('historyScreen');" class="w-full bg-white text-slate-800 border-2 border-slate-200 font-bold py-5 rounded-2xl shadow-sm text-lg flex items-center justify-center gap-2 active:scale-95 transition">
                <span>📊</span> Consultar / Gerar PDF
            </button>
        </div>
    </div>

    <!-- ================= TELA DE INSERÇÃO ================= -->
    <div id="formScreen" class="hidden flex-col bg-white min-h-screen md:min-h-[600px]">
        <div class="bg-slate-900 text-white p-5 flex items-center gap-4 sticky top-0 z-10">
            <button onclick="navegarPara('mainScreen')" class="p-2 bg-slate-800 rounded-full active:scale-95 transition">⬅️</button>
            <h2 class="text-xl font-bold">Lançamento</h2>
        </div>

        <form id="lancamentoForm" class="p-6 md:p-10 flex flex-col gap-5 w-full max-w-full overflow-hidden" onsubmit="salvarLancamento(event)">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
                <div class="md:col-span-2 w-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Tipo</label>
                    <div class="flex gap-3 w-full">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="tipo" value="Credito" class="peer hidden" checked>
                            <div class="text-center py-3 border-2 rounded-xl peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 font-bold text-slate-400">Receita</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="tipo" value="Debito" class="peer hidden">
                            <div class="text-center py-3 border-2 rounded-xl peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 font-bold text-slate-400">Despesa</div>
                        </label>
                    </div>
                </div>

                <div class="w-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" required class="w-full p-4 border-2 border-slate-200 rounded-xl text-xl outline-none box-border">
                </div>

                <div class="w-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Data</label>
                    <input type="date" id="data" required class="w-full p-4 border-2 border-slate-200 rounded-xl text-lg outline-none box-border">
                </div>

                <div class="md:col-span-2 w-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Descrição</label>
                    <input type="text" id="descricao" required class="w-full p-4 border-2 border-slate-200 rounded-xl text-lg outline-none box-border">
                </div>

                <div class="md:col-span-2 grid grid-cols-2 gap-4 mt-2 w-full">
                    <div class="relative w-full">
                        <input type="file" id="fotoItem" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div id="boxFotoItem" class="bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border">
                            <span class="text-3xl mb-1">📷</span><span class="text-xs font-bold text-center" id="lblFotoItem">Foto Item</span>
                        </div>
                    </div>
                    <div class="relative w-full">
                        <input type="file" id="fotoNota" accept="image/*" capture="environment" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div id="boxFotoNota" class="bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border">
                            <span class="text-3xl mb-1">🧾</span><span class="text-xs font-bold text-center" id="lblFotoNota">Foto Nota</span>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-4 active:scale-95 transition">Salvar Lançamento</button>
            <p id="statusMsg" class="text-center text-sm font-bold hidden"></p>
        </form>
    </div>

    <!-- ================= TELA DE CONSULTA / EXTRATO ================= -->
    <div id="historyScreen" class="hidden flex-col bg-slate-50 min-h-screen md:min-h-[600px]">
        <div class="bg-slate-900 text-white p-5 flex items-center justify-between sticky top-0 z-10 shadow-md">
            <button onclick="navegarPara('mainScreen')" class="p-2 bg-slate-800 rounded-full active:scale-95 transition">⬅️</button>
            <h2 class="text-xl font-bold">Extrato & PDF</h2>
            <button onclick="carregarRegistros()" class="text-xl p-2 bg-slate-800 rounded-full active:scale-95 transition" title="Atualizar">🔄</button>
        </div>

        <div class="bg-white p-4 border-b border-slate-200 flex flex-col gap-3 w-full box-border">
            <div class="flex gap-2 items-end w-full">
                <div class="flex-1 min-w-0">
                    <label class="text-xs font-bold text-slate-500">De:</label>
                    <input type="date" id="pdfDataInicio" class="w-full p-2 border rounded-lg text-sm bg-slate-50 box-border">
                </div>
                <div class="flex-1 min-w-0">
                    <label class="text-xs font-bold text-slate-500">Até:</label>
                    <input type="date" id="pdfDataFim" class="w-full p-2 border rounded-lg text-sm bg-slate-50 box-border">
                </div>
                <button onclick="gerarPDF()" class="bg-red-600 text-white p-2 px-3 rounded-lg font-bold text-sm shadow-sm hover:bg-red-700 active:scale-95 transition flex items-center gap-1 shrink-0">
                    📄 PDF
                </button>
            </div>
            <p class="text-xs text-slate-400 text-center">Filtre as datas acima para gerar um extrato em PDF do período.</p>
        </div>

        <div class="p-4 md:p-6 flex flex-col gap-3 w-full overflow-x-hidden box-border" id="listaRegistros"></div>
    </div>

</div>

<script>
    // =====================================================================
    // CONFIGURAÇÕES
    // =====================================================================
    const SENHA_SECRETA = "leo123";
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyapk-MAhHPnlywGms5cDGHN46UyOV2ZlWFxTPWnNzKiey-O_YfgID00x1DfFeMuEpgfw/exec"; // <--- COLOQUE A URL AQUI
    
    let registrosGlobais = []; 

    // =====================================================================
    // LOGIN AUTOMÁTICO (LOCAL STORAGE)
    // =====================================================================
    window.onload = function() {
        if (localStorage.getItem('meuCaixaLogado') === 'true') {
            navegarPara('mainScreen');
            document.getElementById('data').valueAsDate = new Date();
            carregarRegistros();
        }
    };

    // =====================================================================
    // NAVEGAÇÃO E UX
    // =====================================================================
    function fazerLogin() {
        if (document.getElementById('senha').value === SENHA_SECRETA) {
            localStorage.setItem('meuCaixaLogado', 'true'); // <-- GRAVA O ACESSO NO CELULAR
            navegarPara('mainScreen');
            document.getElementById('data').valueAsDate = new Date();
            carregarRegistros(); 
        } else { alert("Senha incorreta!"); }
    }
    
    function sair() { 
        localStorage.removeItem('meuCaixaLogado'); // <-- APAGA O ACESSO DO CELULAR
        document.getElementById('senha').value = '';
        navegarPara('loginScreen'); 
    }
    
    function navegarPara(telaId) {
        ['loginScreen', 'mainScreen', 'formScreen', 'historyScreen'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        });
        document.getElementById(telaId).classList.remove('hidden');
        document.getElementById(telaId).classList.add('flex');
    }

    document.getElementById('fotoItem').addEventListener('change', function() {
        if(this.files.length > 0) document.getElementById('boxFotoItem').className = "bg-green-50 border-2 border-solid border-green-400 text-green-700 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border";
    });
    document.getElementById('fotoNota').addEventListener('change', function() {
        if(this.files.length > 0) document.getElementById('boxFotoNota').className = "bg-green-50 border-2 border-solid border-green-400 text-green-700 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border";
    });

    // =====================================================================
    // COMPRESSÃO
    // =====================================================================
    function compressImage(file, maxWidth = 1000, quality = 0.7) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve({ name: file.name, mimeType: 'image/jpeg', data: canvas.toDataURL('image/jpeg', quality).split(',')[1] });
                };
            };
            reader.onerror = error => reject(error);
        });
    }

    // =====================================================================
    // SALVAR DADOS
    // =====================================================================
    async function salvarLancamento(event) {
        event.preventDefault();
        const btnSalvar = document.getElementById('btnSalvar');
        const statusMsg = document.getElementById('statusMsg');
        btnSalvar.innerText = "Enviando... ⏳";
        btnSalvar.disabled = true;

        try {
            const dados = {
                senha: SENHA_SECRETA,
                tipo: document.querySelector('input[name="tipo"]:checked').value,
                valor: document.getElementById('valor').value,
                descricao: document.getElementById('descricao').value,
                data: document.getElementById('data').value
            };

            dados.fotoItem = await compressImage(document.getElementById('fotoItem').files[0]);
            dados.fotoNota = await compressImage(document.getElementById('fotoNota').files[0]);

            const resposta = await fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                body: JSON.stringify(dados),
                headers: { "Content-Type": "text/plain;charset=utf-8" } 
            });

            const resultado = await resposta.json();
            if (resultado.erro) throw new Error(resultado.erro);

            statusMsg.innerText = "Salvo com sucesso! ✅";
            statusMsg.className = "text-green-600 mt-2 block";
            
            document.getElementById('lancamentoForm').reset();
            document.getElementById('data').valueAsDate = new Date();
            document.getElementById('boxFotoItem').className = "bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border";
            document.getElementById('boxFotoNota').className = "bg-blue-50 border-2 border-dashed border-blue-300 text-blue-600 flex flex-col items-center justify-center p-4 rounded-xl h-28 box-border";

            setTimeout(() => { 
                statusMsg.classList.add('hidden'); 
                navegarPara('mainScreen');
                carregarRegistros();
            }, 2000);

        } catch (error) {
            statusMsg.innerText = "Erro: " + error.message;
            statusMsg.className = "text-red-500 mt-2 block";
        } finally {
            btnSalvar.innerText = "Salvar Lançamento";
            btnSalvar.disabled = false;
        }
    }

    // =====================================================================
    // BUSCAR DADOS
    // =====================================================================
    async function carregarRegistros() {
        if(URL_APPS_SCRIPT === "COLOQUE_AQUI_A_URL_DO_SEU_WEB_APP") return;
        const divLista = document.getElementById('listaRegistros');
        divLista.innerHTML = '<p class="text-center p-10 text-slate-500 font-bold animate-pulse">Atualizando dados...</p>';

        try {
            const urlSemCache = URL_APPS_SCRIPT + "?t=" + new Date().getTime();
            const resposta = await fetch(urlSemCache);
            const registros = await resposta.json();
            if (registros.erro) throw new Error(registros.erro);

            registrosGlobais = registros; 
            divLista.innerHTML = ''; 
            
            let totalCredito = 0; let totalDebito = 0;
            let mesCredito = 0; let mesDebito = 0;
            
            const dataHoje = new Date();
            const mesAtual = dataHoje.getMonth() + 1;
            const anoAtual = dataHoje.getFullYear();

            [...registros].reverse().forEach(item => {
                const valorNum = parseFloat(item.valor.toString().replace(',','.')) || 0;
                let isCredito = item.tipo === "Credito" || item.tipo === "Receita";
                let cor = isCredito ? "green" : "red";
                let sinal = isCredito ? "+" : "-";

                if (isCredito) totalCredito += valorNum; else totalDebito += valorNum;

                let d = item.data.split('T')[0];
                let itemData = new Date(d);
                itemData.setDate(itemData.getDate() + 1);
                
                if (itemData.getMonth() + 1 === mesAtual && itemData.getFullYear() === anoAtual) {
                    if (isCredito) mesCredito += valorNum; else mesDebito += valorNum;
                }

                divLista.innerHTML += `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-2 w-full box-border">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-slate-800 break-words">${item.descricao}</h3>
                            <p class="text-xs text-slate-500">${d.split('-').reverse().join('/')}</p>
                        </div>
                        <div class="text-right shrink-0 ml-2">
                            <p class="font-bold text-${cor}-600">${sinal} R$ ${valorNum.toFixed(2).replace('.', ',')}</p>
                        </div>
                    </div>
                    ${(item.urlItem || item.urlNota) ? `<div class="flex gap-2 mt-3 pt-3 border-t border-slate-100 justify-end">
                        ${item.urlItem ? `<a href="${item.urlItem}" target="_blank" class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600 font-bold">📷 Item</a>` : ''}
                        ${item.urlNota ? `<a href="${item.urlNota}" target="_blank" class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600 font-bold">🧾 Nota</a>` : ''}
                    </div>` : ''}
                </div>`;
            });

            document.getElementById('saldoTotal').innerText = `R$ ${(totalCredito - totalDebito).toFixed(2).replace('.', ',')}`;
            document.getElementById('mesCredito').innerText = mesCredito.toFixed(2).replace('.', ',');
            document.getElementById('mesDebito').innerText = mesDebito.toFixed(2).replace('.', ',');

        } catch (error) { divLista.innerHTML = `<p class="text-center text-red-500">Erro: ${error.message}</p>`; }
    }

    // =====================================================================
    // PDF
    // =====================================================================
    function gerarPDF() {
        if(registrosGlobais.length === 0) return alert("Nenhum dado.");
        const dIni = document.getElementById('pdfDataInicio').value;
        const dFim = document.getElementById('pdfDataFim').value;
        let flt = registrosGlobais.filter(i => {
            let d = i.data.split('T')[0];
            if(dIni && d < dIni) return false;
            if(dFim && d > dFim) return false;
            return true;
        });
        if(flt.length === 0) return alert("Nenhum registro.");
        flt.sort((a,b) => new Date(a.data) - new Date(b.data));
        
        let saldoAtual = 0;
        const linhas = flt.map(i => {
            const v = parseFloat(i.valor.toString().replace(',','.'));
            const isC = i.tipo === "Credito" || i.tipo === "Receita";
            if(isC) saldoAtual += v; else saldoAtual -= v;
            return [i.data.split('T')[0].split('-').reverse().join('/'), i.descricao, isC ? "C" : "D", (isC?"+ ":"- ") + v.toFixed(2).replace('.',','), "R$ " + saldoAtual.toFixed(2).replace('.',',')];
        });

        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        doc.setFontSize(16); doc.text("Extrato - Meu Caixa", 14, 15);
        doc.setFontSize(10); doc.text(`Período: ${dIni ? dIni.split('-').reverse().join('/') : 'Início'} a ${dFim ? dFim.split('-').reverse().join('/') : 'Hoje'}`, 14, 22);
        
        doc.autoTable({
            startY: 28, head: [['Data', 'Descrição', 'Tipo', 'Valor', 'Saldo Acumulado']], body: linhas,
            foot: [['', '', '', 'Saldo Final:', "R$ " + saldoAtual.toFixed(2).replace('.', ',')]],
            theme: 'grid', headStyles: { fillColor: [37, 99, 235] }, footStyles: { fillColor: [226, 232, 240], textColor: [0,0,0], fontStyle: 'bold' }
        });
        doc.save(`extrato.pdf`);
    }
</script>
</body>
</html>
